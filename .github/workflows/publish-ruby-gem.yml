name: Publish Ruby gem

on:
  push:
    branches: ["master"]
    paths:
      - "ruby/**"
      - ".github/workflows/publish-ruby-gem.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  publish:
    name: Upload release to RubyGems
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/purehtml
    permissions:
      contents: read
      id-token: write # Mandatory for Trusted Publishing (OIDC) on RubyGems
    defaults:
      run:
        working-directory: ruby
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby

      - name: Run Tests
        run: bundle exec rake test

      - name: Configure RubyGems credentials (Trusted Publishing)
        uses: rubygems/configure-rubygems-credentials@main

      - name: Build and Publish Gem
        run: |
          gem build purehtml.gemspec
          GEM_FILE=$(ls purehtml-*.gem | head -n 1)
          echo "Attempting to push $GEM_FILE..."
          output=$(gem push "$GEM_FILE" 2>&1) || {
            if echo "$output" | grep -q "Repushing of gem versions is not allowed"; then
              echo "Gem version is already published on RubyGems. Skipping push."
            else
              echo "$output"
              exit 1
            fi
          }
