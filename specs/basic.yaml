# yaml-language-server: $schema=../spec.schema.yaml

description: purehtml basics

specs:
  - description: should extract a string
    input: &input |
      <div>
        <div>
          <span class="foo">Hello, purehtml</span>
        </div>
        <p class="bar">
          123
        </p>

        <p class="baz">
          user profile summary <!-- comment -->
        </p>

        <span class="qty">42</span>
        <span class="truthy-flag">in stock</span>
        <span class="falsy-flag"></span>
      </div>

    expected: Hello, purehtml
    configuration:
      selector: .foo

  - description: should extract a number
    input: *input
    expected: 123
    configuration:
      selector: .bar
      transform: [trim, number]

  - description: should ignore HTML comments
    input: *input
    expected: user profile summary
    configuration:
      selector: .baz
      transform: trim

  - description: should return null if the selector matches nothing
    input: *input
    expected: null
    configuration: { selector: .non-existing }

  - description: should coerce to a number using type number
    input: *input
    expected: 42
    configuration:
      selector: .qty
      type: number

  - description: should apply type number after the transform chain
    input: *input
    expected: 123
    configuration:
      selector: .bar
      type: number
      transform: trim

  - description: should coerce to true using type boolean
    input: *input
    expected: true
    configuration:
      selector: .truthy-flag
      type: boolean

  - description: should coerce to false using type boolean
    input: *input
    expected: false
    configuration:
      selector: .falsy-flag
      type: boolean
