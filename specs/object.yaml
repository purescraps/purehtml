# yaml-language-server: $schema=../spec.schema.yaml

description: Object Configuration Tests

specs:
  - description: should extract object properties

    input: &input |
      <div id="outside"></div>
      <div id="root">
        <div id="a">foo</div>
        <div id="b">bar</div>
        <div id="c">baz</div>
      </div>

    configuration:
      selector: "#root"
      type: object
      properties:
        a: { selector: "#a" }
        b: { selector: "#b" }
        c: { selector: "#c" }

    expected: { a: "foo", b: "bar", c: "baz" }

  - description: should only match child elements
    input: *input
    configuration:
      selector: "#root"
      type: object
      properties:
        childDivs:
          selector: div
          type: array
          items: {}

    expected:
      childDivs: ["foo", "bar", "baz"]

  - description: should search the whole document when there is no selector
    input: *input
    configuration:
      type: object
      properties:
        a: { selector: "#a" }
        b: { selector: "#root > div", type: array, items: {} }
        c:
          union:
            - selector: "#nope"
            - selector: "#c"

    expected: { a: "foo", b: ["foo", "bar", "baz"], c: "baz" }

  - description: should extract an array of objects when there is no root selector
    input: *input
    configuration:
      properties:
        items:
          selector: "#root"
          items:
            properties:
              a: { selector: "#a" }
              b: { selector: "#b" }

    expected: { items: [{ a: "foo", b: "bar" }] }
